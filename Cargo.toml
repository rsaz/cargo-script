[package]
name = "cargo-run"
description = "A powerful, fast, and developer-friendly CLI tool for managing project scripts in Rust. Workspace-aware, cargo-script ready, with hooks, parallel execution, watch mode, and CI/CD templates."
version = "0.6.0"
edition = "2021"
authors = ["Richard Zampieri<br.developer@gmail.com>"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["command-line", "task", "development", "scripts", "automation"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rsaz/cargo-script"
homepage = "https://github.com/rsaz/cargo-script"
documentation = "https://docs.rs/cargo-run"
rust-version = "1.79"

include = [
    "Cargo.toml",
    "README.md",
    "src/**",
]

[features]
default = ["watch", "parallel"]
# Enables the file-watcher subsystem (notify based)
watch = ["dep:notify", "dep:notify-debouncer-full"]
# Enables tokio-based parallel execution of scripts/workspace members
parallel = ["dep:tokio"]

[dependencies]
clap = { version = "4.5.7", features = ["derive"]}
clap_complete = "4.5.61"
serde = { version = "1.0.203", features = ["derive"]}
serde_json = "1.0"
toml = "0.9"
colored = "3.0"
emoji = "0.2.1"
indicatif = "0.18"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }

# Optional dependencies (gated by features)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"], optional = true }
notify = { version = "6.1", optional = true }
notify-debouncer-full = { version = "0.3", optional = true }

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
tempfile = "3.10"

[[bin]]
name = "cargo-script"
path = "src/main.rs"

[[bin]]
name = "cgs"
path = "src/cgs.rs"






